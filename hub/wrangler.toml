# unikit.ll3.kr 진입 워커 — dist/ 정적 자산을 직접 서빙한다(Workers Static
# Assets). Pages 프로젝트/프록시 원본 없음. 커스텀 도메인 바인딩이 DNS·인증서를
# 관리하고, 경로 alias 302는 src/index.js가, SPA 폴백은 not_found_handling이 담당.
name = "unikit-hub"
main = "src/index.js"
compatibility_date = "2026-11-14"
workers_dev = false

routes = [
  { pattern = "unikit.ll3.kr", custom_domain = true },
]

[assets]
directory = "../dist"
binding = "ASSETS"
# 모든 요청을 워커가 먼저 받아 alias 302를 적용한 뒤 자산으로 넘긴다.
run_worker_first = true
# 자산에 없는 경로는 index.html로 — SPA 폴백.
not_found_handling = "single-page-application"
