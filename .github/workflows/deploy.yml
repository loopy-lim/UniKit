# UniKit 포털 사이트 → Cloudflare Pages (정적 dist/)
# 패밀리 배포 패턴(deploy-pages.yml / site.yml)과 동일: 시크릿은
# CLOUDFLARE_API_TOKEN(Pages:Edit) + CLOUDFLARE_ACCOUNT_ID.
name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build static site
        run: bun run build

      # wrangler pages deploy는 프로젝트가 없으면 8000007로 실패한다.
      # 멱등 + 재시도: GET으로 존재하면 바로 통과, 404면 생성. Pages API는
      # 가끔 503(no healthy upstream)을 반환하므로 비JSON 응답도 재시도한다.
      - name: Ensure Cloudflare Pages project
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$base/unikit")
            if [ "$code" = "200" ]; then echo "Pages project unikit exists"; exit 0; fi
            if [ "$code" = "404" ]; then
              resp=$(curl -s -X POST "$base" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data '{"name":"unikit","production_branch":"main"}')
              echo "$resp" | jq . 2>/dev/null || echo "$resp"
              # success 또는 이미 존재(8000007)만 통과 — 토큰 오류 등은 즉시 실패.
              if echo "$resp" | jq -e '.success == true or (.errors[]?.code == 8000007)' >/dev/null 2>&1; then
                exit 0
              fi
            fi
            echo "attempt $i: HTTP $code — retrying in 15s"
            sleep 15
          done
          echo "Cloudflare Pages API unreachable after 3 attempts" >&2
          exit 1

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=unikit --branch=main

      - name: Attach custom domain
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          echo "Attaching custom domain unikit.ll3.kr to Pages..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/unikit/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"unikit.ll3.kr"}' | jq . || true

          echo "Querying Pages domains status..."
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/unikit/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" | jq . || true
