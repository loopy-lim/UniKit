# UniKit 포털 사이트 → Cloudflare Pages (정적 dist/)
# 패밀리 배포 패턴(deploy-pages.yml / site.yml)과 동일: 시크릿은
# CLOUDFLARE_API_TOKEN(Pages:Edit) + CLOUDFLARE_ACCOUNT_ID.
name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build static site
        run: bun run build

      # wrangler pages deploy는 프로젝트가 없으면 8000007로 실패한다
      # (deploy-rustra.yml에서 배운 교훈 — 생성을 먼저 보장).
      - name: Ensure Cloudflare Pages project
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          resp=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"unikit","production_branch":"main"}')
          echo "$resp" | jq .
          # success 또는 이미 존재(8000007)만 통과 — 그 외 에러(토큰 오류 등)는
          # 여기서 실패해야 원인이 정확히 드러난다.
          echo "$resp" | jq -e '.success == true or (.errors[]?.code == 8000007)' >/dev/null

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=unikit --branch=main

      - name: Attach custom domain
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          echo "Attaching custom domain unikit.ll3.kr to Pages..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/unikit/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"unikit.ll3.kr"}' | jq . || true

          echo "Querying Pages domains status..."
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/unikit/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" | jq . || true
