# UniKit 포털 — dist/를 허브 워커(Workers Static Assets)로 배포해
# unikit.ll3.kr에서 바로 서빙한다. Pages 프로젝트는 없다.
# 시크릿은 CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build static site
        run: bun run build

      # dist/를 hub/wrangler.toml의 [assets]로 싣고 unikit-hub 워커를 배포한다.
      # 커스텀 도메인 바인딩(unikit.ll3.kr)도 wrangler가 관리한다.
      - name: Deploy hub worker (unikit.ll3.kr)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: hub
          command: deploy
